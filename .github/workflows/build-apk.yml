# Builds the TungTom APK in the cloud (GitHub Actions, free). Put this file at .github/workflows/build-apk.yml and the
# userscript (TungTom_user.js) in the root of the repo; the Android project is generated by the first step.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Tao project Android tu script
        run: |
          set -e
          SCRIPT=$(ls ./*.user.js ./*_user.js 2>/dev/null | head -1)
          if [ -z "$SCRIPT" ]; then echo "Khong thay file userscript (*.user.js hoac *_user.js) o thu muc goc repo"; exit 1; fi
          echo "Dung script: $SCRIPT"
          mkdir -p app/src/main/assets app/src/main/res/drawable app/src/main/java/com/tungtom/pokesurvivor
          cp "$SCRIPT" app/src/main/assets/tungtom.user.js
          cat > settings.gradle <<'PSEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TungTom'
          include ':app'
          PSEOF
          cat > build.gradle <<'PSEOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          PSEOF
          cat > gradle.properties <<'PSEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          PSEOF
          cat > app/build.gradle <<'PSEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tungtom.pokesurvivor'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.tungtom.pokesurvivor'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.11.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // WebViewCompat.addDocumentStartJavaScript: runs the script before any script of the page, like a userscript manager
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          PSEOF
          cat > app/src/main/AndroidManifest.xml <<'PSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="TungTom"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|uiMode|density"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PSEOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'PSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D0F1E"
                  android:pathData="M18,0 h72 a18,18 0 0 1 18,18 v72 a18,18 0 0 1 -18,18 h-72 a18,18 0 0 1 -18,-18 v-72 a18,18 0 0 1 18,-18 z" />
              <path
                  android:fillColor="#22D3EE"
                  android:pathData="M28,30 h7 v48 h-7 z" />
              <path
                  android:fillColor="#A78BFA"
                  android:pathData="M42,30 L84,54 L42,78 Z" />
          </vector>
          PSEOF
          cat > app/src/main/java/com/tungtom/pokesurvivor/MainActivity.java <<'PSEOF'
          package com.tungtom.pokesurvivor;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.HashSet;
          import java.util.Set;

          /**
           * Opens the game in a WebView and runs the TungTom userscript (assets/tungtom.user.js) in it, before the page's own
           * scripts, exactly like a userscript manager does in a browser: the bot's panel shows up on the game page.
           */
          public class MainActivity extends Activity {
              private static final String HOME = "https://pokesurvivor.com/";
              private static final String[] GAME_HOSTS = {"pokesurvivor.com", "www.pokesurvivor.com", "pokesurvivor.doofcraft.com"};

              private WebView web;
              private String script = "";
              private boolean injectAtDocumentStart = false;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);   // a bot running for hours: no screen timeout
                  script = readAsset("tungtom.user.js");

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);                       // localStorage: the panel's settings and the game's save
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  // Best: the browser itself runs the script first thing in every frame of the game's pages (needs a recent WebView)
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      Set<String> origins = new HashSet<>();
                      for (String h : GAME_HOSTS) origins.add("https://" + h);
                      try {
                          WebViewCompat.addDocumentStartJavaScript(web, script, origins);
                          injectAtDocumentStart = true;
                      } catch (RuntimeException e) {
                          injectAtDocumentStart = false;
                      }
                  }

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          // Older WebView: run it as soon as the page starts loading (slightly later than a userscript manager)
                          if (!injectAtDocumentStart && isGame(url) && !script.isEmpty()) view.evaluateJavascript(script, null);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String scheme = u.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) return false;   // stays in the app
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));                // mailto:, intent:, market: ...
                          } catch (Exception ignored) {
                          }
                          return true;
                      }

                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          recreate();                                                           // the WebView process died: start over
                          return true;
                      }
                  });

                  if (savedInstanceState != null && web.restoreState(savedInstanceState) != null) return;
                  web.loadUrl(HOME);
              }

              private static boolean isGame(String url) {
                  if (url == null) return false;
                  Uri u = Uri.parse(url);
                  String host = u.getHost();
                  if (host == null || !"https".equals(u.getScheme())) return false;
                  for (String h : GAME_HOSTS) if (h.equals(host)) return true;
                  return false;
              }

              private String readAsset(String name) {
                  try (InputStream in = getAssets().open(name)) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return out.toString("UTF-8");
                  } catch (IOException e) {
                      return "";
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          PSEOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Doi ten APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TungTom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TungTom-apk
          path: TungTom.apk

      - name: Dang len Releases (tai thang file .apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TungTom APK ${{ github.run_number }}
          files: TungTom.apk
          
